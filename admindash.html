<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0f172a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        header button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .button-bar {
            margin-bottom: 20px;
        }

        .button-bar button {
            background-color: #3b82f6;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        tr:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>

    <header>
        <h2>Admin Dashboard</h2>
        <div>
            <button onclick="goToAnalytics()">📊 Analytics</button>
            <button onclick="logout()">🔓 Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="button-bar">
            <h3>📋 Bookings</h3>
        </div>

        <table>
            <thead>
                
            </thead>
            <tbody id="bookingTable">
                <!-- Booking rows will be injected by admindash.js -->
            </tbody>
        </table>
    </div>

    <script src="./js/admindash.js"></script>
    <script>
        function goToAnalytics() {
            window.location.href = "/analytics";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "adminlogin.html";
        }
    </script>

</body>
</html>
