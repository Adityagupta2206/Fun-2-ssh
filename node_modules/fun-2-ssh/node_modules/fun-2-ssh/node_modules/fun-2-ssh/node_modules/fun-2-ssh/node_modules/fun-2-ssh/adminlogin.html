  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #1d3557, #457b9d, #a8dadc);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
      }

      .glass-card {
        backdrop-filter: blur(12px);
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        width: 100%;
        max-width: 380px;
        color: #ffffff;
      }

      .glass-card h3 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
      }

      .form-group {
        position: relative;
        margin-bottom: 20px;
      }

      .form-control {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 8px;
        padding: 12px 40px 12px 42px;
        color: #fff;
      }

      .form-control:focus {
        background-color: rgba(255, 255, 255, 0.3);
        box-shadow: none;
        border: 1px solid #fff;
        color: #fff;
      }

      .form-group i {
        position: absolute;
        top: 50%;
        left: 12px;
        transform: translateY(-50%);
        color: #ffffffcc;
      }

      .btn-login {
        background: #f1faee;
        color: #1d3557;
        font-weight: 600;
        border-radius: 8px;
        padding: 12px;
        width: 100%;
        transition: all 0.3s ease-in-out;
      }

      .btn-login:hover {
        background-color: #a8dadc;
        color: #1d3557;
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 500;
      }

      .back-button:hover {
        background: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>

    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</button>

    <!-- Login Card -->
    <div class="glass-card">
      <h3>Admin Login</h3>
      <form id="adminLoginForm">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" id="adminUsername" class="form-control" placeholder="Username" required>
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPassword" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-login mt-3">Login</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
  </html>
